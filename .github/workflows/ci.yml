#            -tc "SELECT count(*) FROM predictions" | grep -q 1


      - name: диагностика
        if: failure()

        run: |
          kubectl get pods -o wide
          
          
          kubectl describe deploy/mobile-service | tail -20
          kubectl logs deploy/mobile-service -c api --previous --tail=100 || true
          kubectl get events --sort-by=.metadata.creationTimestamp
