apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mobile-service
spec:
  ingressClassName: traefik
  rules:
    - host: wrong.locallost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: mobile-service, port: {number: 80}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mlflow
  namespace: mlops
spec:
  ingressClassName: traefik
  rules:
    - host: mlflow.locallost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: mlflow, port: {number: 5000}}