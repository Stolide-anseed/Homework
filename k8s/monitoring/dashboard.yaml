# Grafana imports this ConfigMap through the grafana_dashboard label.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mobile-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  mobile-price.json: |
    {
      "uid": "mobile-service",
      "title": "Mobile Price — сервис и модель",
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "schemaVersion": 39,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Версии модели и число подов",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 8,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count by (version) (mobile_price_model_info{namespace=\"default\",service=\"mobile-service\"} == 1)",
              "legendFormat": "{{version}}",
              "instant": true
            }
          ],
          "options": {
            "textMode": "value_and_name",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Запросов к /v1/predict за 5 минут",
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 8,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(http_requests_total{namespace=\"default\",service=\"mobile-service\",handler=\"/v1/predict\"}[5m]))",
              "instant": true
            }
          ],
          "options": {
            "textMode": "value_and_name",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Рестарты текущих контейнеров сервиса",
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 8,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"default\",pod=~\"mobile-service-.*\",container=\"api\"})",
              "instant": true
            }
          ],
          "options": {
            "textMode": "value_and_name",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Запросы к /v1/predict в секунду",
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status) (rate(http_requests_total{namespace=\"default\",service=\"mobile-service\",handler=\"/v1/predict\"}[$__rate_interval]))",
              "legendFormat": "HTTP {{status}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Задержка /v1/predict: p50 и p95",
          "gridPos": {
            "x": 12,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "min": 0
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "1000 * histogram_quantile(0.5, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"default\",service=\"mobile-service\",handler=\"/v1/predict\"}[$__rate_interval])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "1000 * histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"default\",service=\"mobile-service\",handler=\"/v1/predict\"}[$__rate_interval])))",
              "legendFormat": "p95"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Доли предсказанных классов цены",
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (price_class) (rate(mobile_price_predictions_total{namespace=\"default\",service=\"mobile-service\"}[$__rate_interval])) / scalar(sum(rate(mobile_price_predictions_total{namespace=\"default\",service=\"mobile-service\"}[$__rate_interval])))",
              "legendFormat": "Класс {{price_class}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "bargauge",
          "title": "Предсказания по классам цены за 15 минут",
          "gridPos": {
            "x": 12,
            "y": 13,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "decimals": 0
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (price_class) (increase(mobile_price_predictions_total{namespace=\"default\",service=\"mobile-service\"}[15m]))",
              "legendFormat": "Класс {{price_class}}",
              "instant": true
            }
          ],
          "options": {
            "orientation": "vertical",
            "displayMode": "basic",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Смена версии модели при выкате: число подов",
          "gridPos": {
            "x": 0,
            "y": 21,
            "w": 24,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "decimals": 0
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count by (version) (mobile_price_model_info{namespace=\"default\",service=\"mobile-service\"} == 1)",
              "legendFormat": "{{version}}"
            }
          ]
        }
      ]
    }
